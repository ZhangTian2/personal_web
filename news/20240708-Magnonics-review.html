<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="shortcut icon" href="../个人网页old/website/icon.ico">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('.menu-toggle').addEventListener('click', function() {
                const navMenu = document.querySelector('.nav-ul');
                navMenu.classList.toggle('active');
                const icon = this.querySelector('i');
                icon.classList.toggle('fa-bars');
                icon.classList.toggle('fa-times');
            });
            document.querySelectorAll('.nav-ul a').forEach(link => {
                link.addEventListener('click', function () {
                    if (window.innerWidth <= 768) {
                        document.querySelector('.nav-ul').classList.remove('active');
                        const icon = document.querySelector('.menu-toggle i');
                        icon.classList.remove('fa-times');
                        icon.classList.add('fa-bars');
                    }
                });
            });
        });
    </script>
</head>

                <p style="font-size: 1.05rem; line-height: 1.9; text-align: justify;">
                    论文《Magnonics: Materials, physics, and devices》于2024年7月8日在物理期刊 <strong>Applied Physics Letters</strong> 上发表（125, 020501）。该综述全面介绍了磁子学领域的材料、物理和器件研究进展，为磁子学领域的研究者提供了重要参考。
