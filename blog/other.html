    <link rel="stylesheet" href="blog.css">
    <link rel="shortcut icon" href="../个人网页old/website/icon.ico">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="title-section">
                    <h1>张天乙 · 博客</h1>
                </div>
                <button class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <ul class="nav-ul">
                    <li><a href="index.html">自旋电子学</a></li>
                    <li><a href="ai.html">人工智能学</a></li>
                    <li class="nav-ul-li-active"><a href="other.html">其他</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="blog-hero" style="text-align: left;">
            <p style="display: block; border-left: none; padding-left: 0;">

    <footer class="container">
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.querySelector('.menu-toggle');
            if (menuToggle) {
                menuToggle.addEventListener('click', function() {
                    const navMenu = document.querySelector('.nav-ul');
                    navMenu.classList.toggle('active');
                    const icon = this.querySelector('i');
                    icon.classList.toggle('fa-bars');
                    icon.classList.toggle('fa-times');
                });
            }

            document.querySelectorAll('.nav-ul a').forEach(link => {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 768) {
                        document.querySelector('.nav-ul').classList.remove('active');
                        const icon = document.querySelector('.menu-toggle i');
                        icon.classList.remove('fa-times');
                        icon.classList.add('fa-bars');
                    }
                });
            });
        });
    </script>
</body>
</html>
